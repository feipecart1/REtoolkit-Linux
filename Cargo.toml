[package]
name = "retoolkit-linux"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Native Linux reverse engineering workstation manager"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
zip = { version = "9", default-features = false }
object = { version = "0.37", default-features = false, features = ["read", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
