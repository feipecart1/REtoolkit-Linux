name: Publish Light and Full release
on:
  push:
    tags: ['v*']
    branches: ['release/v0.2.0-retry']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release/v0.2.0-retry'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'^version = "([^"]+)"', Path('Cargo.toml').read_text(), re.M)[1]
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match Cargo version'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RELEASE_TAG=v' + version + '\n')
          Path('.build').mkdir(exist_ok=True)
          PY
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libadwaita-1-dev xvfb xauth rpm desktop-file-utils patchelf fakeroot libglib2.0-bin
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate application
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          python3 -m unittest discover -s tests -p 'test_*.py'
          cargo build --locked --release
          xvfb-run -a dbus-run-session -- env GDK_BACKEND=x11 GSK_RENDERER=cairo GTK_A11Y=none target/release/retoolkit-linux --gui-smoke-test
      - name: Build Light and Full installers
        run: python3 scripts/build-release.py
      - name: Prepare release assets
        run: python3 scripts/prepare-release.py
      - name: Upload and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "REtoolkit Linux ${GITHUB_REF_NAME} — Light e Full" --notes-file packaging/editions/RELEASE-NOTES.md
          gh release upload "$RELEASE_TAG" dist/release/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
