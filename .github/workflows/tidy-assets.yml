name: Organize existing release downloads
on:
  push:
    branches: ['release/asset-cleanup-v0.2.1']
permissions:
  contents: read
jobs:
  tidy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep installers and complete sources
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/tidy-release-assets.py
